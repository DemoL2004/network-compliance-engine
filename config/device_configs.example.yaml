global:
  stp:
    mode: rapid
  ospf:
    process_id: 1
    default_passive_interface: true
  etherchannel:
    protocol: LACP
  domain_name: lab.local
  hsrp:
    preemption: true
  username: example
  password: example
  secret: example

devices:
  ACC1:
    management_ip: 192.168.99.11
    ip_routing: false
    vlans:
      '10':
        name: HR
      '30':
        name: IT
      '99':
        name: mgmt
    interfaces:
      vlan99:
        type: svi
        ip: 192.168.99.11
        subnet: 255.255.255.0
      gigabitethernet0/0:
        type: switchport
        mode: trunk
        vlans: [10,30,99]
      gigabitethernet0/1:
        type: switchport
        mode: trunk
        vlans: [10,30,99]
      gigabitethernet0/2:
        type: switchport
        mode: access
        vlan: 10
      gigabitethernet0/3:
        type: switchport
        mode: access
        vlan: 30
  ACC2:
    management_ip: 192.168.99.12
    ip_routing: false
    vlans:
      '10':
        name: HR
      '20':
        name: Finance
      '99':
        name: mgmt
    interfaces:
      vlan99:
        type: svi
        ip: 192.168.99.12
        subnet: 255.255.255.0
      gigabitethernet0/0:
        type: switchport
        mode: trunk
        vlans: [10,20,99]
      gigabitethernet0/1:
        type: switchport
        mode: trunk
        vlans: [10,20,99]
      gigabitethernet0/2:
        type: switchport
        mode: access
        vlan: 10
      gigabitethernet0/3:
        type: switchport
        mode: access
        vlan: 20
  ACC3:
    management_ip: 192.168.99.13
    ip_routing: false
    vlans:
      '30':
        name: IT
      '40':
        name: Guest
      '99':
        name: mgmt
    interfaces:
      vlan99:
        type: svi
        ip: 192.168.99.13
        subnet: 255.255.255.0
      gigabitethernet0/0:
        type: switchport
        mode: trunk
        vlans: [30,40,99]
      gigabitethernet0/1:
        type: switchport
        mode: trunk
        vlans: [30,40,99]
      gigabitethernet0/2:
        type: switchport
        mode: access
        vlan: 30
      gigabitethernet0/3:
        type: switchport
        mode: access
        vlan: 40
  ACC4:
    management_ip: 192.168.99.14
    ip_routing: false
    vlans:
      '10':
        name: HR
      '20':
        name: Finance
      '30':
        name: IT
      '40':
        name: Guest
      '99':
        name: mgmt
    interfaces:
      vlan99:
        type: svi
        ip: 192.168.99.14
