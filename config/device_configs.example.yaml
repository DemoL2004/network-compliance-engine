      gigabitethernet0/3:
        type: switchport
        mode: access
        vlan: 40
  CORE:
    management_ip: 192.168.99.4
    ip_routing: true
    etherchannel:
      '2':
        interfaces: [gigabitethernet0/0,gigabitethernet0/2]
        mode: passive
      '4':
        interfaces: [gigabitethernet0/1,gigabitethernet0/3]
        mode: passive
    interfaces:
      gigabitethernet1/0:
        type: routed
        ip: 200.0.0.1
        subnet: 255.255.255.252
      gigabitethernet1/1:
        type: routed
        ip: 192.168.212.200
        subnet: 255.255.255.0
      loopback0:
        type: routed
        ip: 192.168.99.4
        subnet: 255.255.255.255
      port-channel2:
        type: routed
        ip: 10.1.1.2
        subnet: 255.255.255.252
      port-channel4:
        type: routed
        ip: 10.2.2.2
        subnet: 255.255.255.252
    routes:
      - source: 0.0.0.0
        subnet: 0.0.0.0
        destination: 200.0.0.2
    ospf:
      net_interfaces:
        gigabitethernet1/0:
          area: 0
        gigabitethernet1/1:
          area: 0
        loopback0:
          area: 0
        port-channel2:
          area: 0
        port-channel4:
          area: 0
      advt_interfaces:
        - port-channel2
        - port-channel4
        - gigabitethernet1/0
      router_id: 3.3.3.3
      default_information: True
  DIST1:
    management_ip: 192.168.99.2
    ip_routing: true
    vlans:
      '10':
        name: HR
      '20':
        name: Finance
      '30':
        name: IT
      '40':
        name: Guest
      '99':
        name: mgmt
    etherchannel:
      '1':
        interfaces: [gigabitethernet0/1,gigabitethernet1/0]
        mode: passive
      '2':
        interfaces: [gigabitethernet0/0,gigabitethernet1/1]
        mode: active
    hsrp:
      vlan10:
        '10':
          ip: 192.168.10.1
          role: primary
      vlan20:
        '20':
          ip: 192.168.20.1
          role: secondary
      vlan30:
        '30':
          ip: 192.168.30.1
          role: primary
      vlan40:
        '40':
          ip: 192.168.40.1
          role: secondary
      vlan99:
        '99':
          ip: 192.168.99.1
          role: primary
    interfaces:
      gigabitethernet0/2:
        type: switchport
        mode: trunk
        vlans: [10,30,99]
      gigabitethernet0/3:
        type: switchport
        mode: trunk
        vlans: [10,20,99]
      gigabitethernet1/2:
        type: switchport
        mode: trunk
        vlans: [30,40,99]
      gigabitethernet1/3:
        type: switchport
        mode: trunk
        vlans: [10,20,30,40,99]
      port-channel2:
        type: routed
        ip: 10.1.1.1
        subnet: 255.255.255.252
      port-channel1:
        type: switchport
        mode: trunk
        vlans: [10,20,30,40,99]
      vlan10:
        type: svi
        ip: 192.168.10.2
        subnet: 255.255.255.0
        acl:
          in:
            name: BLOCK_HR
            mode: extended
            seq:
              '10':
                action: deny
                source_network: 192.168.10.0
                source_wildcard: 0.0.0.255
                destination_network: 192.168.20.0
                destination_wildcard: 0.0.0.255
              '20':
                action: permit
                source_network: any
                destination_network: any
      vlan20:
        type: svi
        ip: 192.168.20.2
        subnet: 255.255.255.0
      vlan30:
        type: svi
        ip: 192.168.30.2
        subnet: 255.255.255.0
      vlan40:
        type: svi
        ip: 192.168.40.2
        subnet: 255.255.255.0
      vlan99:
        type: svi
        ip: 192.168.99.2
        subnet: 255.255.255.0
    dhcp:
      HR:
        ip: 192.168.10.0
        subnet: 255.255.255.0
        default_gateway: 192.168.10.1
      Finance:
        ip: 192.168.20.0
        subnet: 255.255.255.0
        default_gateway: 192.168.20.1
      IT:
        ip: 192.168.30.0
        subnet: 255.255.255.0
        default_gateway: 192.168.30.1
      Guest:
        ip: 192.168.40.0
        subnet: 255.255.255.0
        default_gateway: 192.168.40.1
    ospf:
      net_interfaces:
        vlan10:
          area: 0
        vlan20:
          area: 0
        vlan30:
          area: 0
        vlan40:
          area: 0
        vlan99:
          area: 0
        port-channel2:
          area: 0
      advt_interfaces:
        - port-channel2
      router_id: 1.1.1.1
    stp:
      '10': primary
      '20': secondary
      '30': primary
      '40': secondary
      '99': primary
  DIST2:
